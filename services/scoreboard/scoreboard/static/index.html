<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DVAP Scoreboard</title>
  <style>
    :root {
      --bg: #0c1116; --panel: #141b22; --panel-2: #1a232c; --line: #2a3641;
      --text: #dde6ec; --dim: #8696a3; --accent: #3d9be0; --ok: #3ebd8f; --bad: #ff6b6b; --warn: #f2a93b;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
    header { padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
    header strong { font-size: 18px; letter-spacing: .12em; }
    header .sub { color: var(--dim); }
    header .spacer { flex: 1; }
    .team { font: 600 12px var(--mono); color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
    form.flag { display: flex; gap: 6px; }
    input, button { font: inherit; }
    input { padding: 7px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; min-width: 240px; }
    button { padding: 7px 12px; font-weight: 600; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #04121d; }
    button:disabled { opacity: .5; cursor: default; }
    main { padding: 18px 22px 40px; max-width: 1100px; margin: 0 auto; }
    .progress { color: var(--dim); margin: 0 0 18px; }
    .asi { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; margin-bottom: 26px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .card.solved { border-color: var(--ok); }
    .card h3 { margin: 0; font-size: 15px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
    .tag.diff { color: var(--warn); }
    .tag.solved { color: #04121d; background: var(--ok); border-color: var(--ok); }
    .tag.active { color: #04121d; background: var(--accent); border-color: var(--accent); }
    .story, .mit { white-space: pre-wrap; color: var(--text); }
    .obj { color: var(--dim); }
    .obj b { color: var(--text); }
    details { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--panel-2); }
    details summary { cursor: pointer; color: var(--dim); font-size: 12px; }
    .hint { margin: 6px 0 0; padding: 6px 10px; border-left: 2px solid var(--warn); background: var(--panel-2); }
    .flagbox { font: 600 13px var(--mono); color: var(--ok); word-break: break-all; background: var(--panel-2); border: 1px solid var(--ok); border-radius: 6px; padding: 8px 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
    .msg { color: var(--warn); min-height: 1.2em; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <strong>DVAP</strong><span class="sub">Scoreboard · OWASP Top 10 for Agentic Applications</span>
    <span class="spacer"></span>
    <span class="team" id="team">team —</span>
    <form class="flag" id="flagform">
      <input id="flaginput" placeholder="DVAP{...}" aria-label="Submit a flag">
      <button type="submit">Submit flag</button>
    </form>
  </header>
  <main>
    <p class="progress" id="progress">Loading challenges…</p>
    <p class="msg" id="msg"></p>
    <div id="board"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const el = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };
    const ASI_NAMES = {
      ASI01: "ASI01 · Agent Goal Hijack", ASI02: "ASI02 · Tool Misuse", ASI03: "ASI03 · Identity & Privilege Abuse",
      ASI04: "ASI04", ASI05: "ASI05 · Unsafe Tool / Code Execution", ASI06: "ASI06 · Memory & Context Poisoning",
      ASI07: "ASI07", ASI08: "ASI08", ASI09: "ASI09 · Insufficient Oversight", ASI10: "ASI10",
    };
    let revealed = {}; // challenge id -> how many hints shown

    async function post(url, body) {
      const r = await fetch(url, { method: "POST", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
      return r.json();
    }

    function card(ch) {
      const c = el("div", null, "card" + (ch.active ? " active" : "") + (ch.solved ? " solved" : ""));
      c.append(el("h3", `${ch.id} — ${ch.title}`));
      const tags = el("div", null, "tags");
      tags.append(el("span", ch.owasp_asi, "tag"), el("span", ch.difficulty, "tag diff"));
      if (ch.active && !ch.solved) tags.append(el("span", "ACTIVE", "tag active"));
      if (ch.solved) tags.append(el("span", "SOLVED", "tag solved"));
      c.append(tags);

      const obj = el("p", null, "obj"); obj.append(el("b", "Objective: "), document.createTextNode(ch.objective));
      c.append(obj);
      const story = el("details"); story.append(el("summary", "Story")); story.append(el("div", ch.story, "story")); c.append(story);

      // Progressive hints
      const shown = revealed[ch.id] || 0;
      for (let i = 0; i < shown && i < ch.hints.length; i++) c.append(el("div", `Hint ${i + 1}: ${ch.hints[i]}`, "hint"));

      const mit = el("details"); mit.append(el("summary", "Mitigation (spoiler)")); mit.append(el("div", ch.mitigation, "mit"));

      const row = el("div", null, "row");
      const start = el("button", ch.active ? "Restart" : "Start challenge", "primary");
      start.onclick = async () => { $("msg").textContent = `Resetting lab for ${ch.id}…`; await post(`/api/challenges/${ch.id}/start`); $("msg").textContent = `${ch.id} is active. The lab is reset; make your move.`; load(); };
      row.append(start);
      if (shown < ch.hints.length) {
        const hint = el("button", `Hint (${shown}/${ch.hints.length})`);
        hint.onclick = () => { revealed[ch.id] = shown + 1; load(); };
        row.append(hint);
      }
      c.append(row);

      if (ch.solved && ch.flag) c.append(el("div", ch.flag, "flagbox"));
      c.append(mit);
      return c;
    }

    async function load() {
      const data = await (await fetch("/api/challenges")).json();
      $("team").textContent = data.flags_disabled ? `team ${data.team} · ${data.flags_disabled}` : `team ${data.team}`;
      const solved = data.challenges.filter((c) => c.solved).length;
      $("progress").textContent = `${solved} / ${data.challenges.length} solved${data.active ? ` · active: ${data.active}` : ""}`;
      const board = $("board");
      board.replaceChildren();
      const groups = {};
      for (const ch of data.challenges) (groups[ch.owasp_asi] ||= []).push(ch);
      for (const asi of Object.keys(groups).sort()) {
        board.append(el("h2", ASI_NAMES[asi] || asi, "asi"));
        const grid = el("div", null, "grid");
        for (const ch of groups[asi]) grid.append(card(ch));
        board.append(grid);
      }
    }

    $("flagform").addEventListener("submit", async (e) => {
      e.preventDefault();
      const r = await post("/api/flag", { flag: $("flaginput").value });
      $("msg").textContent = r.ok ? `Correct — ${r.challenge} marked solved.` : `Rejected: ${r.reason}`;
      if (r.ok) { $("flaginput").value = ""; load(); }
    });

    load();
    setInterval(load, 4000); // picks up auto-solved challenges
  </script>
</body>
</html>
