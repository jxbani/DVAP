<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DVAP CMMS – Maintenance tickets</title>
  <style>
    :root { --bg: #0c1116; --panel: #141b22; --line: #2a3641; --text: #dde6ec; --dim: #8696a3; --accent: #3d9be0; --bad: #ff6b6b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
    header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    header strong { font-size: 18px; letter-spacing: .12em; }
    header span { color: var(--dim); }
    main { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; padding: 16px 20px; align-items: start; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
    h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
    label { display: block; margin-bottom: 10px; font-size: 12px; color: var(--dim); }
    input, select, textarea { display: block; width: 100%; margin-top: 4px; padding: 8px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
    textarea { min-height: 90px; resize: vertical; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { padding: 9px 14px; font: inherit; font-weight: 600; color: #04121d; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
    #result { margin: 10px 0 0; min-height: 1.45em; }
    #result.error { color: var(--bad); }
    article { border-top: 1px solid var(--line); padding: 10px 0; }
    article:first-of-type { border-top: 0; padding-top: 0; }
    article h3 { margin: 0; font-size: 15px; }
    .meta { color: var(--dim); font: 12px ui-monospace, Consolas, monospace; margin: 2px 0 6px; }
    article p { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .field { color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <header><strong>DVAP CMMS</strong><span>Maintenance tickets · simulated lab · no login required</span></header>
  <main>
    <section>
      <h2>New ticket</h2>
      <form id="new-ticket">
        <label>Title <input name="title" required maxlength="200"></label>
        <label>Asset <input name="asset" maxlength="200" placeholder="e.g. P-101"></label>
        <label>Priority
          <select name="priority"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select>
        </label>
        <label>Your name <input name="created_by" maxlength="200" placeholder="anonymous"></label>
        <label>Description <textarea name="description" maxlength="20000"></textarea></label>
        <label>Attachments (text only) <textarea name="attachments" maxlength="20000"></textarea></label>
        <button type="submit">Create ticket</button>
        <p id="result" role="status"></p>
      </form>
    </section>
    <section>
      <h2>Tickets</h2>
      <div id="tickets">Loading…</div>
    </section>
  </main>
  <script>
    // Ticket text is untrusted (anyone can write it), so it is only ever inserted with textContent.
    const el = (tag, text, cls) => {
      const node = document.createElement(tag);
      node.textContent = text;
      if (cls) node.className = cls;
      return node;
    };

    async function loadTickets() {
      const tickets = await (await fetch("/tickets")).json();
      const list = document.getElementById("tickets");
      list.replaceChildren();
      for (const t of tickets.reverse()) {
        const article = list.appendChild(document.createElement("article"));
        article.append(
          el("h3", `#${t.id} ${t.title}`),
          el("div", `${t.asset || "no asset"} · ${t.priority} · ${t.status} · by ${t.created_by}`, "meta"),
        );
        for (const [label, value] of [["Description", t.description], ["Technician notes", t.technician_notes], ["Attachments", t.attachments]]) {
          if (value) article.append(el("div", label, "field"), el("p", value));
        }
      }
      if (!tickets.length) list.textContent = "No tickets.";
    }

    document.getElementById("new-ticket").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target, result = document.getElementById("result");
      const body = Object.fromEntries(new FormData(form));
      if (!body.created_by) delete body.created_by;
      const r = await fetch("/tickets", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      result.className = r.ok ? "" : "error";
      result.textContent = r.ok ? `Created ticket #${(await r.json()).id}.` : `Could not create the ticket (${r.status}).`;
      if (r.ok) { form.reset(); loadTickets(); }
    });

    loadTickets();
  </script>
</body>
</html>
