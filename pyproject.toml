[project]
name = "dvap"
version = "0.1.0"
description = "Damn Vulnerable Agentic Plant: a simulated ICS lab for the OWASP Top 10 for Agentic Applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "asyncua>=2.1.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "litellm>=1.109.1",
    "mcp>=1.12,<2",
    "pydantic>=2",
    "pymodbus>=3,<4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
dvap = "bench.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]  # pinned: the build backend is a dependency too
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]  # only the CLI is packaged; the services run via pythonpath (see below)

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
docs = [
    "mkdocs-material>=9.8.1",
]
media = [
    "imageio-ffmpeg>=0.8.1",
    "playwright>=1.65.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/plant-sim", "services/plc", "services/historian", "services/hmi", "services/cmms", "services/agent-operator", "services/mcp-plant", "services/sandbox", "services/scoreboard", "services/vendor-analytics", "services/maintenance-planner"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
# Non-strict, per CLAUDE.md. Services are separate top-level packages on the path, like in pytest.
python_version = "3.12"
mypy_path = "services/plant-sim,services/plc,services/historian,services/hmi,services/cmms,services/agent-operator,services/mcp-plant,services/sandbox,services/scoreboard,services/vendor-analytics,services/maintenance-planner"
files = ["dvap_common", "bench", "services/plant-sim/plant_sim", "services/plc/plc", "services/historian/historian", "services/hmi/hmi", "services/cmms/cmms", "services/agent-operator/agent_operator", "services/mcp-plant/mcp_plant", "services/sandbox/sandbox", "services/scoreboard/scoreboard", "services/vendor-analytics/vendor_analytics", "services/maintenance-planner/maintenance_planner"]
explicit_package_bases = true
ignore_missing_imports = true  # asyncua, pymodbus and litellm ship partial or no type information

[tool.ruff]
line-length = 110
src = [".", "services/plant-sim", "services/plc", "services/historian", "services/hmi", "services/cmms", "services/agent-operator", "services/mcp-plant", "services/sandbox", "services/scoreboard", "services/vendor-analytics", "services/maintenance-planner"]
