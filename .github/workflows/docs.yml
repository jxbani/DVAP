name: Docs

# Builds the MkDocs site from docs/ (strict: a broken link fails the build) on every PR that
# touches it, and deploys it to GitHub Pages from main. Pages source must be "GitHub Actions".
# README links are checked against the build on PRs, and against the live site after deploy.
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", "scripts/check_links.py", "pyproject.toml", "uv.lock",
            ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "README.md", "scripts/check_links.py", "pyproject.toml", "uv.lock",
            ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.13.5" # uv itself, pinned
      - run: uv sync --locked --only-group docs
      - run: uv run --no-sync mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: README links (docs-site links against this build)
        run: python3 scripts/check_links.py README.md --site site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            scripts/check_links.py
          sparse-checkout-cone-mode: false
      - name: The site is live and every README link resolves
        run: python3 scripts/check_links.py README.md
