name: Release images

# Publishes DVAP's own images, multi-arch (amd64 + arm64), to
# ghcr.io/<owner>/dvap-<service>:<version>, the names docker-compose.yml pulls.
# Run it by pushing a tag that matches pyproject's version, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        service:
          - { name: plant-sim, package: plant_sim, module: api }
          - { name: plc, package: plc, module: main }
          - { name: historian, package: historian, module: api }
          - { name: cmms, package: cmms, module: api }
          - { name: hmi, package: hmi, module: api }
          - { name: scoreboard, package: scoreboard, module: api }
          - { name: sandbox, package: sandbox, module: api }
          - { name: vendor-analytics, package: vendor_analytics, module: server }
          - { name: mcp-plant, package: mcp_plant, module: main }
          - { name: agent-operator, package: agent_operator, module: api }
          - { name: maintenance-planner, package: maintenance_planner, module: api }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: meta
        name: Version from pyproject (must match the tag)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SERVICE=${{ matrix.service.name }}
            PACKAGE=${{ matrix.service.package }}
            MODULE=${{ matrix.service.module }}
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/dvap-${{ matrix.service.name }}:${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
