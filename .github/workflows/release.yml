name: Release

# On a v<major>.<minor>.<patch> tag, or a SemVer pre-release tag (v0.9.0-beta.1, v1.0.0-rc.1): build
# DVAP's images for linux/amd64 + linux/arm64, push them to
# ghcr.io/<owner>/dvap-<service>:<version> (the names docker-compose.yml pulls), sign them with
# cosign (keyless, GitHub OIDC), attach an SPDX SBOM and a build-provenance attestation to each,
# and publish a GitHub Release with the CHANGELOG section as notes plus dvap-<version>.zip, which
# runs the lab without cloning. The exact steps for a maintainer: docs/RELEASING.md.
#
# Pre-releases (-alpha.N, -beta.N, -rc.N) are published as a GitHub pre-release, never marked
# latest. Images of every release are tagged with their version only: never `latest` or `stable`.
on:
  push:
    # Filter patterns, not regexes; the verify job checks the exact form (scripts/release_version.py).
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: tag, versions and changelog agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: v
        # SemVer tag vs PEP 440 pyproject.toml (0.9.0-beta.1 <-> 0.9.0b1), .env.example and CHANGELOG.md
        run: |
          if ! out=$(python3 scripts/release_version.py "$GITHUB_REF_NAME"); then echo "$out"; exit 1; fi
          echo "$out" | tee -a "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.service.name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing and attestations
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        service:
          - { name: plant-sim, package: plant_sim, module: api }
          - { name: plc, package: plc, module: main }
          - { name: historian, package: historian, module: api }
          - { name: cmms, package: cmms, module: api }
          - { name: hmi, package: hmi, module: api }
          - { name: scoreboard, package: scoreboard, module: api }
          - { name: sandbox, package: sandbox, module: api }
          - { name: vendor-analytics, package: vendor_analytics, module: server }
          - { name: mcp-plant, package: mcp_plant, module: main }
          - { name: agent-operator, package: agent_operator, module: api }
          - { name: maintenance-planner, package: maintenance_planner, module: api }
    env:
      IMAGE: ghcr.io/${{ needs.verify.outputs.owner }}/dvap-${{ matrix.service.name }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SERVICE=${{ matrix.service.name }}
            PACKAGE=${{ matrix.service.package }}
            MODULE=${{ matrix.service.module }}
          # The version only, for every release: never `latest` or `stable`, so a pre-release can't move them.
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4 # cosign itself, pinned
      - name: Sign the image (keyless, by digest)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM (SPDX, syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dvap-${{ matrix.service.name }}-${{ env.VERSION }}.spdx.json
          syft-version: v1.57.2 # syft itself, pinned
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service.name }}
          path: dvap-${{ matrix.service.name }}-${{ env.VERSION }}.spdx.json
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on=1; next} index($0, "## [") == 1 || /^\[[^]]*\]: / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty CHANGELOG section for $VERSION"; exit 1; }
          printf '\n---\nImages: `ghcr.io/%s/dvap-<service>:%s` (linux/amd64, linux/arm64), signed with cosign (keyless); verify with docs/RELEASING.md.\n' \
            "${GITHUB_REPOSITORY_OWNER,,}" "$VERSION" >> notes.md
          if [ "$PRERELEASE" = true ]; then
            printf '\n**Pre-release** for testing; expect changes before %s.\n' "${VERSION%%-*}" >> notes.md
          fi
      - name: dvap-${{ env.VERSION }}.zip (run without cloning)
        run: python3 scripts/make_dist.py "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dvap-${{ env.VERSION }}.zip
      - name: Create the release
        # A pre-release is marked as one and never becomes "Latest" (the README badge and /releases/latest).
        run: |
          if [ "$PRERELEASE" = true ]; then kind=(--prerelease --latest=false); else kind=(--latest); fi
          gh release create "v$VERSION" "${kind[@]}" --title "DVAP $VERSION" --notes-file notes.md --verify-tag \
            "dist/dvap-$VERSION.zip" sboms/*.spdx.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
