name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: pytest (fake LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # The suite needs no model or network: the agent runs on a scripted FakeLLM, and the PLC,
      # plant and services run in-process on localhost.
      - run: uv run pytest -q

  compose:
    name: docker compose build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      # The lab without the model and the agent (neither is needed for these checks): the gateway
      # pulls in the UIs, and mcp-plant pulls in the PLC, plant, sandbox, bus and the rest.
      - run: docker compose up -d --wait gateway mcp-plant
      - run: python3 scripts/smoke_test.py
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
