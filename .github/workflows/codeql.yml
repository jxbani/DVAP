name: CodeQL

# Static analysis of the Python code and of these workflows. DVAP contains deliberate
# vulnerabilities (each marked `# DVAP-VULN: <challenge-id>` and listed in docs/VULNERABILITIES.md);
# alerts on those are expected: dismiss them as "used in tests" with the challenge ID.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 3" # weekly, Wednesdays 04:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
