# DVAP gateway: the only container on the internet-facing `edge` network and the only one that
# publishes ports. It forwards each published port to one UI on the internal `plant` network, so
# none of the vulnerable services has a route out of the lab. The upstreams are fixed here; nothing
# a participant sends can change where the gateway connects. See docs/LAB_SAFETY.md.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    # Read-only root filesystem: every writable path lives on the /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Docker's embedded DNS, re-resolved every 10 s so a restarted UI container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The HMI streams agent and guard events (Server-Sent Events): pass them through unbuffered.
    proxy_buffering off;
    proxy_read_timeout 1h;

    server { listen 8080; location / { set $upstream http://hmi:8000;        proxy_pass $upstream; } }
    server { listen 8081; location / { set $upstream http://cmms:8000;       proxy_pass $upstream; } }
    server { listen 8090; location / { set $upstream http://scoreboard:8000; proxy_pass $upstream; } }
}
