# DVAP lab. Everything is simulated and stays on the internal `plant` network.
# Only the HMI, CMMS ticket form, scoreboard and guard dashboard may publish ports, and only on 127.0.0.1.

x-healthcheck: &healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 5s
  timeout: 3s
  retries: 5

services:
  plant-sim:
    build: { context: ., args: { SERVICE: plant-sim, PACKAGE: plant_sim } }
    image: dvap-plant-sim:${DVAP_VERSION:-0.1.0}
    environment:
      PLANT_SEED: ${PLANT_SEED:-0}
      PLANT_NOISE: ${PLANT_NOISE:-0}
    networks: [plant]
    healthcheck: *healthcheck

  plc:
    build: { context: ., args: { SERVICE: plc, PACKAGE: plc, MODULE: main } }
    image: dvap-plc:${DVAP_VERSION:-0.1.0}
    environment:
      PLANT_URL: http://plant-sim:8000
      PLC_DIFFICULTY: ${PLC_DIFFICULTY:-easy} # easy | medium | hard
    depends_on:
      plant-sim: { condition: service_healthy }
    networks: [plant]
    healthcheck: *healthcheck

  historian:
    build: { context: ., args: { SERVICE: historian, PACKAGE: historian } }
    image: dvap-historian:${DVAP_VERSION:-0.1.0}
    environment:
      PLC_HOST: plc
      HISTORIAN_DB: /data/historian.sqlite
    volumes: [historian-data:/data]
    depends_on:
      plc: { condition: service_healthy }
    networks: [plant]
    healthcheck: *healthcheck

  # Inter-agent message bus. No password: deliberate, used by later challenges.
  # Valkey: the BSD-licensed, Redis-compatible fork (Redis 7.4+ is RSAL/SSPL). Same protocol and
  # tools (redis-cli works), so the lab and its challenges still speak "Redis".
  bus:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [plant]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Maintenance tickets. No authentication (DVAP-VULN: C01): this is where participants inject text.
  cmms:
    build: { context: ., args: { SERVICE: cmms, PACKAGE: cmms } }
    image: dvap-cmms:${DVAP_VERSION:-0.1.0}
    environment:
      CMMS_DB: /data/cmms.sqlite
    volumes: [cmms-data:/data]
    networks: [plant, edge] # `edge` only so the ticket form can be published
    ports: ["127.0.0.1:${CMMS_PORT:-8081}:8000"] # loopback only, never 0.0.0.0 (the IP is not configurable)
    healthcheck: *healthcheck

  hmi:
    build: { context: ., args: { SERVICE: hmi, PACKAGE: hmi } }
    image: dvap-hmi:${DVAP_VERSION:-0.1.0}
    environment:
      PLANT_URL: http://plant-sim:8000
      HISTORIAN_URL: http://historian:8000
      REDIS_URL: redis://bus:6379
    depends_on:
      historian: { condition: service_healthy }
      bus: { condition: service_healthy }
    # `plant` to reach the lab, `edge` only so the port below can be published.
    networks: [plant, edge]
    ports: ["127.0.0.1:${HMI_PORT:-8080}:8000"] # loopback only, never 0.0.0.0 (the IP is not configurable)
    healthcheck: *healthcheck

  # Challenge engine, reset, flags and scoring UI. Reads challenges/ (bind-mounted so authors
  # can edit without a rebuild) and resets every service per challenge.
  scoreboard:
    build: { context: ., args: { SERVICE: scoreboard, PACKAGE: scoreboard } }
    image: dvap-scoreboard:${DVAP_VERSION:-0.1.0}
    environment:
      TEAM: ${TEAM:-solo}
      DVAP_FLAG_SECRET: ${DVAP_FLAG_SECRET:-dvap-dev-secret}
      CHALLENGES_DIR: /app/challenges
      PLANT_URL: http://plant-sim:8000
      PLC_URL: http://plc:8000
      CMMS_URL: http://cmms:8000
      HISTORIAN_URL: http://historian:8000
      MCP_URL: http://mcp-plant:8000
      AGENT_URL: http://agent-operator:8000 # for the C09 busy-human approver
      REDIS_URL: redis://bus:6379
    volumes: ["./challenges:/app/challenges:ro"]
    depends_on:
      bus: { condition: service_healthy }
    networks: [plant, edge] # `edge` only so the UI port can be published
    ports: ["127.0.0.1:${SCOREBOARD_PORT:-8090}:8000"] # loopback only, never 0.0.0.0 (the IP is not configurable)
    healthcheck: *healthcheck

  # Diagnostic sandbox. The blast radius for run_diagnostic command injection (C05).
  # On the internal `plant` network (no `edge`, so no internet): confined to the lab, but a
  # shell inside it can reach the PLC over Modbus, which is the point of the C05 challenge.
  sandbox:
    build: { context: ., args: { SERVICE: sandbox, PACKAGE: sandbox } }
    image: dvap-sandbox:${DVAP_VERSION:-0.1.0}
    networks: [plant]
    # Hardened: it runs attacker-controlled shell commands (C05). See docs/LAB_SAFETY.md.
    user: "65534:65534" # nobody
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    healthcheck: *healthcheck

  # Third-party MCP server for demand forecasting (DVAP-VULN: C04). Its tool description is a
  # poisoned, rug-pulling instruction channel. Internal network only.
  vendor-analytics:
    build: { context: ., args: { SERVICE: vendor-analytics, PACKAGE: vendor_analytics, MODULE: server } }
    image: dvap-vendor-analytics:${DVAP_VERSION:-0.1.0}
    networks: [plant]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MCP server: the only way the agent touches the plant. Internal network only.
  mcp-plant:
    build: { context: ., args: { SERVICE: mcp-plant, PACKAGE: mcp_plant, MODULE: main } }
    image: dvap-mcp-plant:${DVAP_VERSION:-0.1.0}
    environment:
      PLC_HOST: plc
      CMMS_URL: http://cmms:8000
      HISTORIAN_URL: http://historian:8000
      SANDBOX_URL: http://sandbox:8000
      REDIS_URL: redis://bus:6379
      MEMORY_DB: /data/memory.sqlite
      DVAP_DEFENDED: ${DVAP_DEFENDED:-} # 1 boots SafeEnvelope on; the scoreboard also toggles it per challenge
    volumes: [memory-data:/data]
    depends_on:
      plc: { condition: service_healthy }
      cmms: { condition: service_healthy }
      historian: { condition: service_healthy }
      sandbox: { condition: service_healthy }
      bus: { condition: service_healthy }
    networks: [plant]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The victim LLM agent. Talks to the plant only through mcp-plant.
  agent-operator:
    build: { context: ., args: { SERVICE: agent-operator, PACKAGE: agent_operator, MODULE: api } }
    image: dvap-agent-operator:${DVAP_VERSION:-0.1.0}
    environment:
      MCP_URL: http://mcp-plant:8000/mcp
      VENDOR_MCP_URL: http://vendor-analytics:8000/mcp # third-party server (C04)
      REDIS_URL: redis://bus:6379
      MODEL: ${MODEL:-ollama/qwen2.5:7b-instruct}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
      AGENT_CYCLE_SECONDS: ${AGENT_CYCLE_SECONDS:-30}
      # For a hosted model instead of Ollama, set MODEL (e.g. anthropic/claude-3-5-sonnet)
      # and pass the key through, e.g. ANTHROPIC_API_KEY or OPENAI_API_KEY.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mcp-plant: { condition: service_healthy }
      vendor-analytics: { condition: service_healthy }
    networks: [plant]
    healthcheck: *healthcheck

  # Second agent: issues work orders to the operator over the unauthenticated Redis bus (C07).
  maintenance-planner:
    build: { context: ., args: { SERVICE: maintenance-planner, PACKAGE: maintenance_planner } }
    image: dvap-maintenance-planner:${DVAP_VERSION:-0.1.0}
    environment:
      REDIS_URL: redis://bus:6379
    depends_on:
      bus: { condition: service_healthy }
    networks: [plant]
    healthcheck: *healthcheck

  # Local LLM, on the internal network only: it must not be a bridge to the internet, because a
  # shell inside the lab (C05) could otherwise use its pull API to reach arbitrary hosts. Models
  # are fetched by the one-shot `ollama-pull` service below (`make model`). Runs on CPU unless a
  # GPU is wired in (uncomment the deploy block). The agent then runs fully offline.
  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    volumes: [ollama-models:/root/.ollama]
    networks: [plant]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-shot model download, the only container with internet access, and only while it runs.
  # It writes into the same volume the internal `ollama` reads. Not started by `make up`.
  ollama-pull:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: [setup]
    volumes: [ollama-models:/root/.ollama]
    networks: [edge]
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct}"]

networks:
  plant:
    internal: true # no route to the host or the internet
  edge: {}

volumes:
  historian-data: # cleared by `make reset`
  cmms-data: # cleared by `make reset`, which re-seeds the 10 benign tickets
  memory-data: # the agent's long-term memory; cleared by `make reset`
  ollama-models: # downloaded LLM weights (kept across `make reset`)
