# DVAP lab. Everything is simulated and stays on the internal `plant` network.
# DVAP's own images are pulled prebuilt from ghcr.io (multi-arch: amd64 + arm64). To build them
# locally instead, add the override: docker compose -f docker-compose.yml -f docker-compose.build.yml
# (`./dvap up --build` and `make up` do this).
# Only the `gateway` publishes ports (HMI with its guard panel, CMMS ticket form, scoreboard), and
# only on 127.0.0.1. tests/test_lab_safety.py enforces these rules.

x-healthcheck: &healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 5s
  timeout: 3s
  retries: 5

services:
  plant-sim:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-plant-sim:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      PLANT_SEED: ${PLANT_SEED:-0}
      PLANT_NOISE: ${PLANT_NOISE:-0}
    networks: [plant]
    healthcheck: *healthcheck

  plc:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-plc:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      PLANT_URL: http://plant-sim:8000
      PLC_DIFFICULTY: ${PLC_DIFFICULTY:-easy} # easy | medium | hard
    depends_on:
      plant-sim: { condition: service_healthy }
    networks: [plant]
    healthcheck: *healthcheck

  historian:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-historian:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      PLC_HOST: plc
      HISTORIAN_DB: /data/historian.sqlite
    volumes: [historian-data:/data]
    depends_on:
      plc: { condition: service_healthy }
    networks: [plant]
    healthcheck: *healthcheck

  # Inter-agent message bus. No password: deliberate, used by later challenges.
  # Valkey: the BSD-licensed, Redis-compatible fork (Redis 7.4+ is RSAL/SSPL). Same protocol and
  # tools (redis-cli works), so the lab and its challenges still speak "Redis".
  bus:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [plant]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Maintenance tickets. No authentication (DVAP-VULN: C01): this is where participants inject text.
  cmms:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-cmms:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      CMMS_DB: /data/cmms.sqlite
    volumes: [cmms-data:/data]
    networks: [plant] # published through the gateway, never directly
    healthcheck: *healthcheck

  hmi:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-hmi:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      PLANT_URL: http://plant-sim:8000
      HISTORIAN_URL: http://historian:8000
      REDIS_URL: redis://bus:6379
    depends_on:
      historian: { condition: service_healthy }
      bus: { condition: service_healthy }
    networks: [plant] # published through the gateway, never directly
    healthcheck: *healthcheck

  # Challenge engine, reset, flags and scoring UI. Reads challenges/ (bind-mounted so authors
  # can edit without a rebuild) and resets every service per challenge.
  scoreboard:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-scoreboard:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      TEAM: ${TEAM:-solo}
      DVAP_FLAG_SECRET: ${DVAP_FLAG_SECRET:-dvap-dev-secret}
      CHALLENGES_DIR: /app/challenges
      PLANT_URL: http://plant-sim:8000
      PLC_URL: http://plc:8000
      CMMS_URL: http://cmms:8000
      HISTORIAN_URL: http://historian:8000
      MCP_URL: http://mcp-plant:8000
      AGENT_URL: http://agent-operator:8000 # for the C09 busy-human approver
      REDIS_URL: redis://bus:6379
    volumes: ["./challenges:/app/challenges:ro"]
    depends_on:
      bus: { condition: service_healthy }
    networks: [plant] # published through the gateway, never directly
    healthcheck: *healthcheck

  # The only way in from the host. It is the only lab container on `edge` (the internet-facing
  # network that port publishing needs) and it proxies each port to one UI on `plant`, so no
  # vulnerable service has a route out of the lab. Fixed upstreams: gateway/nginx.conf.
  gateway:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [plant, edge]
    ports: # loopback only, never 0.0.0.0 (the IP is not configurable, only the port numbers)
      - "127.0.0.1:${HMI_PORT:-8080}:8080"
      - "127.0.0.1:${CMMS_PORT:-8081}:8081"
      - "127.0.0.1:${SCOREBOARD_PORT:-8090}:8090"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      hmi: { condition: service_healthy }
      cmms: { condition: service_healthy }
      scoreboard: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Diagnostic sandbox. The blast radius for run_diagnostic command injection (C05).
  # On the internal `plant` network (no `edge`, so no internet): confined to the lab, but a
  # shell inside it can reach the PLC over Modbus, which is the point of the C05 challenge.
  sandbox:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-sandbox:${DVAP_VERSION:-0.9.0-beta.1}
    networks: [plant]
    # Hardened: it runs attacker-controlled shell commands (C05). See docs/LAB_SAFETY.md.
    user: "65534:65534" # nobody
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    healthcheck: *healthcheck

  # Third-party MCP server for demand forecasting (DVAP-VULN: C04). Its tool description is a
  # poisoned, rug-pulling instruction channel. Internal network only.
  vendor-analytics:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-vendor-analytics:${DVAP_VERSION:-0.9.0-beta.1}
    networks: [plant]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MCP server: the only way the agent touches the plant. Internal network only.
  mcp-plant:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-mcp-plant:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      PLC_HOST: plc
      CMMS_URL: http://cmms:8000
      HISTORIAN_URL: http://historian:8000
      SANDBOX_URL: http://sandbox:8000
      REDIS_URL: redis://bus:6379
      MEMORY_DB: /data/memory.sqlite
      DVAP_DEFENDED: ${DVAP_DEFENDED:-} # 1 boots SafeEnvelope on; the scoreboard also toggles it per challenge
    volumes: [memory-data:/data]
    depends_on:
      plc: { condition: service_healthy }
      cmms: { condition: service_healthy }
      historian: { condition: service_healthy }
      sandbox: { condition: service_healthy }
      bus: { condition: service_healthy }
    networks: [plant]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The victim LLM agent. Talks to the plant only through mcp-plant.
  agent-operator:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-agent-operator:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      MCP_URL: http://mcp-plant:8000/mcp
      VENDOR_MCP_URL: http://vendor-analytics:8000/mcp # third-party server (C04)
      REDIS_URL: redis://bus:6379
      MODEL: ${MODEL:-replay} # see DVAP_LLM_MODE in .env.example
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
      AGENT_CYCLE_SECONDS: ${AGENT_CYCLE_SECONDS:-30}
      AGENT_AUTOSTART: ${AGENT_AUTOSTART:-1} # ./dvap demo sets 0: the agent acts only on cue
      # api mode (./dvap up --mode api): a hosted model and its key; docker-compose.api.yml adds the route out.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-} # any OpenAI-compatible endpoint (blank: api.openai.com)
    depends_on:
      mcp-plant: { condition: service_healthy }
      vendor-analytics: { condition: service_healthy }
    networks: [plant]
    healthcheck: *healthcheck

  # Second agent: issues work orders to the operator over the unauthenticated Redis bus (C07).
  maintenance-planner:
    image: ${DVAP_REGISTRY:-ghcr.io/jxbani}/dvap-maintenance-planner:${DVAP_VERSION:-0.9.0-beta.1}
    environment:
      REDIS_URL: redis://bus:6379
    depends_on:
      bus: { condition: service_healthy }
    networks: [plant]
    healthcheck: *healthcheck

  # Local LLM, on the internal network only: it must not be a bridge to the internet, because a
  # shell inside the lab (C05) could otherwise use its pull API to reach arbitrary hosts. Models
  # are fetched by the one-shot `ollama-pull` service below (`make model`). Runs on CPU unless a
  # GPU is wired in (uncomment the deploy block). The agent then runs fully offline.
  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: [ollama] # only in DVAP_LLM_MODE=ollama (COMPOSE_PROFILES=ollama in .env)
    volumes: [ollama-models:/root/.ollama]
    networks: [plant]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-shot model download, the only container with internet access, and only while it runs.
  # It writes into the same volume the internal `ollama` reads. Not started by `make up`.
  ollama-pull:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: [setup]
    volumes: [ollama-models:/root/.ollama]
    networks: [edge]
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct}"]

networks:
  plant:
    internal: true # no route to the host or the internet
  edge: {}

volumes:
  historian-data: # cleared by `make reset`
  cmms-data: # cleared by `make reset`, which re-seeds the 10 benign tickets
  memory-data: # the agent's long-term memory; cleared by `make reset`
  ollama-models: # downloaded LLM weights (kept across `make reset`)
